name: Refresh Pitch Signals data

# Runs the full data pipeline on GitHub's own runners, which have unrestricted outbound network
# access - unlike the Claude Code cloud environment used for the routines that publish the
# Artifact, which has a fixed egress allowlist that doesn't include football-data.co.uk or
# understat.com and (as far as we've found) has no user-facing way to add to it. Rather than keep
# fighting that, the actual fetch+build work moved here; the Claude routines' job shrank to just
# pulling the result this workflow already committed and publishing it as the Artifact, which
# needs no access to either of those hosts at all.

on:
  schedule:
    # Weekly full refresh - Wednesday 00:00 UTC (10am AEST) - once the whole round (incl. any
    # Mon/Tue night fixtures) has finished, pulling in next week's games.
    - cron: '0 0 * * 3'
    # Matchday tracker refresh - every 2 hours, Fri evening through Tue morning AEST, so newly
    # completed results show up promptly and pending tracked bets grade themselves.
    - cron: '0 12,14,16,18,20,22 * * 5,6,0,1,2'
    - cron: '0 0 * * 6,0,1,2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      # seasons/*.csv is gitignored (fetched fresh, not committed) - on a hosted runner that means
      # a completely empty checkout every single run, with nothing for fetch_current_data's own
      # cache-fallback (see trend_engine.py) to fall back to during a football-data.co.uk outage,
      # and nothing for REFRESH_MODE=quick below to build the current season on top of. Restoring
      # the last run's own seasons/ directory here closes that gap: this key never matches exactly
      # (github.run_id is unique per run), so restore-keys always pulls the most recent prior save,
      # and the post-job save step then stores whatever's on disk now - including this run's own
      # ESPN-refreshed current season - under a new key for the next run to restore in turn.
      - name: Restore season data cache
        uses: actions/cache@v4
        with:
          path: seasons
          key: seasons-${{ github.run_id }}
          restore-keys: |
            seasons-

      # The Wednesday cron (and a manual run) does today's full football-data.co.uk refresh,
      # unchanged - including re-syncing the current season from there too, so any drift between
      # ESPN's and football-data.co.uk's own stat definitions never compounds for more than a
      # week. The frequent matchday crons run 'quick' instead: they skip football-data.co.uk
      # entirely and pull just the current season from ESPN (see fetch_current_data and
      # fetch_espn_current_season_results in trend_engine.py) - the thing actually worth checking
      # every couple of hours, without re-fetching 53 season files that never change in between.
      - name: Run the pipeline
        env:
          REFRESH_MODE: ${{ github.event.schedule == '0 0 * * 3' && 'full' || (github.event.schedule && 'quick' || 'full') }}
        run: |
          python trend_engine.py
          python matchup_engine.py
          python market_floor.py
          python build_player_signals.py
          python generate_html.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add var_era_ledger.csv docs/index.html dashboard.html
          git diff --cached --quiet && echo "Nothing new - skipping commit." && exit 0
          git commit -m "Automated refresh: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
